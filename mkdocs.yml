site_name: YAZGİT University 101
site_description: Ankara Üniversitesi Öğrenci & Geliştirici Rehberi
site_author: YAZGİT Proje Komitesi
site_url: https://au-yazgit.github.io/uni_101/
repo_url: https://github.com/AU-YAZGIT/uni_101
edit_uri: edit/main/docs/

theme:
  name: material
  language: tr
  font: false
  palette:
    # Aydınlık Mod
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Koyu Moda Geç

    # Karanlık Mod
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Açık Moda Geç
  features:
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# MENU
nav:
  - Ana Sayfa: index.md
  - Topluluk:
      - YAZGİT Nedir?: topluluk/yazgit-nedir.md
      - İletişim & Kanallar: topluluk/iletisim.md
  - Üniversite Hayatı:
      - Yerleşkeler & Yaşam: universite/yerleskeler.md
      - Akademik Bilgiler: universite/akademik-takvim.md
  - Geliştirici Rehberi:
      - VS Code Kurulumu: yazilim/vscode-kurulumu.md
      - Python Kurulumu: yazilim/python-kurulumu.md
      - Önerilen Kaynaklar: yazilim/kaynaklar.md