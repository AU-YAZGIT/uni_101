site_name: YAZGİT University 101
site_description: Ankara Üniversitesi Öğrenci & Geliştirici Rehberi
site_author: YAZGİT Proje Komitesi
site_url: https://au-yazgit.github.io/uni_101/
repo_url: https://github.com/AU-YAZGIT/uni_101
edit_uri: edit/main/docs/

theme:
  name: material
  language: tr
  font:
    text: Inter
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    # Aydınlık Mod
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Koyu Moda Geç

    # Karanlık Mod
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Açık Moda Geç
  features:
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

